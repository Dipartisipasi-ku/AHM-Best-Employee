  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif;

      overflow-x: hidden;
    }
    
    /* CSS Khusus untuk Running Text Tema Maroon-Black-Gold */
    .marquee-wrapper {
      overflow: hidden;
      white-space: nowrap;
      background: linear-gradient(90deg, #0f172a 0%, #881337 50%, #0f172a 100%); /* Black - Maroon - Black */
      color: #fbbf24; /* Amber 400 / Gold */
      width: 100%;
      display: flex;
      align-items: center;
      padding: 8px 0;
      border-bottom: 2px solid #fbbf24; /* Border Gold */
    }
    .marquee-text {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 30s linear infinite; 
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0px 1px 2px rgba(0,0,0,0.8);
    }
    @keyframes marquee {
      0% { transform: translate(0, 0); }

    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  /* CSS Khusus untuk Fitur Cetak (Print) */
    @media print {
      body { background-color: white !important; }
      .no-print, header, footer, .marquee-wrapper, .hide-scrollbar { display: none !important; }
      .print-w-full { width: 100% !important; border: none !important; box-shadow: none !important; }
      .overflow-x-auto { overflow: visible !important; }
      table { width: 100% !important; border-collapse: collapse !important; }
      th, td { border: 1px solid #cbd5e1 !important; color: black !important; }
    }
  </style>

  <!-- Load Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Load React, Babel, & Supabase -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="./env.js"></script>

<body class="flex flex-col min-h-screen">
  <div id="root" class="flex flex-col flex-1"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const supabase = window.supabase.createClient(window.env.SUPABASE_URL, window.env.SUPABASE_ANON_KEY);

    // ==========================================
    // 0. KOMPONEN RUNNING TEXT GLOBAL
    // ==========================================
    function RunningTextBar() {
      const [text, setText] = useState('');

      useEffect(() => {
        supabase.from('app_settings').select('value').eq('id', 'running_text').single()
          .then(({data}) => { if (data) setText(data.value); });
          
        const handleUpdate = (e) => setText(e.detail);
        window.addEventListener('runningTextChanged', handleUpdate);
        return () => window.removeEventListener('runningTextChanged', handleUpdate);
      }, []);

      if (!text) return null;
      return (
        <div className="marquee-wrapper shrink-0 shadow-md z-50">
          <span className="marquee-text">✨ {text} ✨</span>
        </div>
      );
    }

    // ==========================================
    // 1. KOMPONEN LANDING PAGE & LOGIN
    // ==========================================
    function LandingPage({ onLogin }) {
      const [units, setUnits] = useState([]);
      const [unitId, setUnitId] = useState('');
      const [password, setPassword] = useState('');
      const [isLoading, setIsLoading] = useState(true);

      useEffect(() => {
        supabase.from('master_units').select('*').order('nama')
          .then(({data}) => {
            if (data) {
              setUnits(data);
              if(data.length > 0) setUnitId(data.find(u => u.id === 'igd') ? 'igd' : data[0].id);
            }
            setIsLoading(false);
          });
      }, []);

      const handleLogin = (e) => {
        e.preventDefault();
        const selected = units.find(u => u.id === unitId);
        if (password === selected.password) {
          onLogin({ id: selected.id, nama: selected.nama, kategori: selected.kategori, password: selected.password });
        } else {
          alert('Password salah! Silakan coba lagi.');
        }
      };

      if (isLoading) return <div className="min-h-screen flex items-center justify-center font-bold text-slate-500">Memuat Data Sistem...</div>;

      return (
        <div className="flex flex-col flex-1 bg-slate-100">
          <RunningTextBar />
          
          {/* Header Maroon-Black-Gold */}
          <header className="bg-gradient-to-r from-slate-900 via-rose-900 to-black px-4 md:px-6 py-4 shadow-lg flex items-center gap-3 md:gap-4 border-b-4 border-amber-500">
            <img src="./logo_atma.png" alt="Logo AHM" className="w-10 h-10 md:w-14 md:h-14 object-contain bg-white rounded-full p-1" />
            <div>
              <h1 className="text-lg md:text-2xl font-extrabold text-amber-400 tracking-wide drop-shadow-md">AHM BEST EMPLOYEE</h1>
              <p className="text-[10px] md:text-sm text-slate-300 font-medium">Sistem Evaluasi Kepatuhan & Disiplin Pegawai RS</p>
            </div>
          </header>

          <main className="flex-1 w-full max-w-7xl mx-auto p-4 md:p-8 space-y-10 md:space-y-16">
            
            {/* Hero Section Adaptive */}
            <div className="flex flex-col lg:flex-row gap-6 lg:gap-12 items-center">
              
              {/* Teks & Gambar Representatif */}
              <div className="w-full lg:w-3/5 space-y-6 flex flex-col justify-center order-2 lg:order-1">
                <div className="rounded-2xl md:rounded-3xl overflow-hidden shadow-2xl border-4 md:border-8 border-slate-300 bg-slate-200 relative group">
                  <img src="https://images.unsplash.com/photo-1584982751601-97dcc096659c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80" alt="Kepatuhan Pegawai" className="w-full h-48 sm:h-64 md:h-[380px] object-cover transition-transform duration-700 group-hover:scale-105" />
                  <div className="absolute inset-0 bg-gradient-to-t from-slate-900/80 to-transparent flex items-end">
                    <div className="p-4 md:p-6 w-full">
                      <p className="text-amber-400 font-bold text-sm md:text-lg drop-shadow-md">Integritas • Disiplin • Paripurna</p>
                    </div>
                  </div>
                </div>
                <div className="px-2 text-center lg:text-left">
                  <h2 className="text-2xl md:text-4xl font-extrabold text-slate-800 leading-tight">Mewujudkan Pelayanan Prima & Integritas Tinggi</h2>
                  <p className="text-slate-600 mt-3 md:mt-4 leading-relaxed text-sm md:text-lg">
                    Aplikasi ini dirancang untuk memantau, mengevaluasi, dan merekapitulasi tingkat kepatuhan berseragam, atribut, dan budaya 5S pegawai secara <i>real-time</i> dan terpusat.
                  </p>
                </div>
              </div>

              {/* Form Login Card */}
              <div className="w-full lg:w-2/5 flex justify-center order-1 lg:order-2">
                <div className="bg-white rounded-2xl md:rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border-t-8 border-rose-800">
                  <div className="p-6 md:p-8 bg-gradient-to-b from-slate-100 to-white flex flex-col items-center border-b border-slate-200">
                    <div className="p-3 md:p-4 bg-slate-900 rounded-full shadow-lg mb-3 md:mb-4 border-2 border-amber-400">
                      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>
                    </div>
                    <h2 className="text-xl md:text-2xl font-bold text-slate-900 text-center">Login Evaluator</h2>
                    <p className="text-[11px] md:text-xs text-rose-700 font-bold text-center mt-1 uppercase tracking-wider">Khusus Kepala Ruangan / Instalasi</p>
                  </div>
                  <form onSubmit={handleLogin} className="p-6 md:p-8 space-y-4 md:space-y-5">
                    <div>
                      <label className="block text-xs md:text-sm font-bold text-slate-700 mb-1.5">Pilih Ruangan Anda</label>
                      <select value={unitId} onChange={e => setUnitId(e.target.value)} className="w-full px-3 md:px-4 py-2.5 md:py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-rose-800 focus:outline-none font-medium text-sm">
                        {units.map(u => <option key={u.id} value={u.id}>[{u.kategori}] {u.nama}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs md:text-sm font-bold text-slate-700 mb-1.5">Password</label>
                      <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Masukkan password ruangan..." className="w-full px-3 md:px-4 py-2.5 md:py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-rose-800 focus:outline-none text-sm" required />
                    </div>
                    <button type="submit" className="w-full py-3 md:py-3.5 bg-gradient-to-r from-rose-800 to-slate-900 hover:from-rose-900 hover:to-black text-amber-400 font-bold rounded-xl transition-all shadow-md hover:shadow-lg mt-4 text-sm md:text-base border border-slate-800">
                      Masuk ke Sistem
                    </button>
                  </form>
                </div>
              </div>

            </div>

            {/* Dashboard Statistik (Di Halaman Landing) */}
            <div className="pt-8 border-t-2 border-slate-300">
              <div className="mb-6 text-center">
                <h3 className="text-xl md:text-2xl font-extrabold text-slate-800 uppercase tracking-wide">📊 Statistik Kepatuhan Rumah Sakit</h3>
                <p className="text-xs md:text-sm text-slate-500 mt-1">Laporan transparansi kelengkapan evaluasi pegawai per unit / ruangan.</p>
              </div>
              <DashboardStats units={units} />
            </div>

          </main>

          {/* Footer dengan Nama Kreator */}
          <footer className="bg-slate-900 text-slate-400 py-6 md:py-8 mt-auto border-t-4 border-rose-900">
            <div className="max-w-7xl mx-auto px-4 text-center">
              <p className="text-xs md:text-sm font-medium tracking-wide text-slate-300">
                Didesain dan dikembangkan oleh : <strong className="text-amber-400">Riandy, S.Kep</strong>
              </p>
              <p className="text-[10px] md:text-xs mt-1.5 text-slate-500">© 2026 RSJD Atma Husada Mahakam.</p>
            </div>
          </footer>
        </div>
      );
    }

    // ==========================================
    // 2. KOMPONEN DASHBOARD STATISTIK TW
    // ==========================================
    function DashboardStats({ units }) {
      // Deteksi Tahun dan Triwulan saat ini secara otomatis
      const today = new Date();
      const currentYear = today.getFullYear().toString();
      const currentMonth = today.getMonth() + 1; // 1-12
      const currentTriwulan = Math.ceil(currentMonth / 3).toString(); // Menghasilkan '1', '2', '3', atau '4'

      const [year, setYear] = useState(currentYear);
      const [tw, setTw] = useState(currentTriwulan); // Otomatis tersetel ke Triwulan saat ini
      const [allStaff, setAllStaff] = useState([]);
      const [evalRecords, setEvalRecords] = useState([]);
      const [isLoading, setIsLoading] = useState(true);

      useEffect(() => {
        supabase.from('master_staff').select('unit_id, nama').then(({data}) => { if (data) setAllStaff(data); });
      }, []);

      useEffect(() => {
        const fetchStats = async () => {
          setIsLoading(true);
          let startDate, endDate;
          if (tw === '1') { startDate = `${year}-01-01`; endDate = `${year}-03-31`; }
          else if (tw === '2') { startDate = `${year}-04-01`; endDate = `${year}-06-30`; }
          else if (tw === '3') { startDate = `${year}-07-01`; endDate = `${year}-09-30`; }
          else if (tw === '4') { startDate = `${year}-10-01`; endDate = `${year}-12-31`; }

          const { data } = await supabase.from('evaluation_records').select('unit_id, nama')
            .gte('tanggal', startDate).lte('tanggal', endDate);
            
          if (data) setEvalRecords(data);
          setIsLoading(false);
        };
        fetchStats();
      }, [year, tw]);

      const tableData = units.map(u => {
        const staffInUnit = allStaff.filter(s => s.unit_id === u.id);
        const totalStaff = staffInUnit.length;
        const evalsInUnit = evalRecords.filter(e => e.unit_id === u.id);
        const uniqueEvaluated = new Set(evalsInUnit.map(e => e.nama.toLowerCase().trim())).size;
        const percentage = totalStaff === 0 ? 0 : Math.round((uniqueEvaluated / totalStaff) * 100);

        return { id: u.id, nama: u.nama, kategori: u.kategori, total: totalStaff, dinilai: uniqueEvaluated, percentage: Math.min(100, percentage) };
      });

      return (
        <div className="bg-white rounded-2xl md:rounded-3xl shadow-lg border border-slate-200 overflow-hidden">
          <div className="p-4 md:p-6 border-b border-slate-200 bg-slate-50 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 className="text-base md:text-lg font-bold text-slate-900">Statistik Triwulan (TW)</h2>
            </div>
            <div className="flex gap-2 w-full md:w-auto">
              <select value={year} onChange={e => setYear(e.target.value)} className="flex-1 md:flex-none px-3 md:px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-rose-800 outline-none font-bold text-slate-700 text-xs md:text-sm">
                <option value="2023">2023</option><option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option>
              </select>
              <select value={tw} onChange={e => setTw(e.target.value)} className="flex-1 md:flex-none px-3 md:px-4 py-2 border border-rose-200 rounded-xl focus:ring-2 focus:ring-rose-800 outline-none font-bold text-rose-900 bg-rose-50 text-xs md:text-sm">
                <option value="1">TW I</option><option value="2">TW II</option><option value="3">TW III</option><option value="4">TW IV</option>
              </select>
            </div>
          </div>

          <div className="overflow-x-auto">
            {isLoading ? (
              <div className="p-12 text-center text-slate-500 font-bold text-sm">Mengkalkulasi Statistik...</div>
            ) : (
              <table className="w-full text-left text-xs md:text-sm border-collapse min-w-[600px]">
                <thead className="bg-slate-900 text-amber-400">
                  <tr>
                    <th className="p-3 md:p-4 font-semibold border-b border-slate-700 text-center">No</th>
                    <th className="p-3 md:p-4 font-semibold border-b border-slate-700">Nama Ruangan / Instalasi</th>
                    <th className="p-3 md:p-4 font-semibold text-center border-b border-slate-700">Total Pegawai</th>
                    <th className="p-3 md:p-4 font-semibold text-center border-b border-slate-700">Selesai Dinilai</th>
                    <th className="p-3 md:p-4 font-semibold text-center border-b border-slate-700">Persentase Capaian</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200 bg-white">
                  {tableData.sort((a,b) => b.percentage - a.percentage).map((row, index) => (
                    <tr key={row.id} className="hover:bg-slate-50 transition-colors">
                      <td className="p-3 md:p-4 font-mono text-slate-500 text-center">{index + 1}</td>
                      <td className="p-3 md:p-4 font-bold text-slate-800">
                        {row.nama} 
                        <span className="block md:inline mt-1 md:mt-0 text-[9px] md:text-[10px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded md:ml-2 font-normal uppercase">{row.kategori}</span>
                      </td>
                      <td className="p-3 md:p-4 text-center font-bold text-slate-600">{row.total}</td>
                      <td className="p-3 md:p-4 text-center font-bold text-rose-800">{row.dinilai}</td>
                      <td className="p-3 md:p-4 text-center">
                        <div className="flex items-center gap-2 justify-center">
                          <div className="w-16 md:w-24 bg-slate-200 rounded-full h-2 md:h-2.5 overflow-hidden">
                            <div className={`h-full rounded-full ${row.percentage >= 100 ? 'bg-emerald-500' : row.percentage >= 50 ? 'bg-amber-500' : 'bg-rose-600'}`} style={{ width: `${row.percentage}%` }}></div>
                          </div>
                          <span className={`text-[10px] md:text-xs font-bold w-8 md:w-10 text-left ${row.percentage >= 100 ? 'text-emerald-600' : row.percentage >= 50 ? 'text-amber-600' : 'text-rose-600'}`}>{row.percentage}%</span>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // 3. KOMPONEN KELOLA PEGAWAI
    // ==========================================
    function StaffManager({ session, units }) {
      const [staffList, setStaffList] = useState([]);
      const [allStaff, setAllStaff] = useState([]);
      const [selectedStaffId, setSelectedStaffId] = useState('');
      const [form, setForm] = useState({ nama: '', jabatan: '', unit_id: session.id });
      const [searchQuery, setSearchQuery] = useState('');
      const [isProcessing, setIsProcessing] = useState(false);
      
      // Tambahan State untuk filter pencarian Dropdown
      const [dropdownSearch, setDropdownSearch] = useState('');

      useEffect(() => { fetchStaff(); fetchAllStaff(); }, [session.id]);

      const fetchStaff = async () => {
        const { data } = await supabase.from('master_staff').select('*').eq('unit_id', session.id).order('nama');
        if (data) setStaffList(data);
      };

      const fetchAllStaff = async () => {
        const { data } = await supabase.from('master_staff').select('*').order('nama');
        if (data) setAllStaff(data);
      };

      const handleSelectStaff = (e) => {
        const val = e.target.value;
        setSelectedStaffId(val);
        if (val === 'NEW' || val === '') setForm({ nama: '', jabatan: '', unit_id: session.id });
        else {
          const staff = allStaff.find(s => s.id === val);
          if (staff) {
            // Cek apakah ruangan pegawai ini masih ada di database master ruangan
            const unitExists = units.some(u => u.id === staff.unit_id);
            setForm({ nama: staff.nama, jabatan: staff.jabatan || '', unit_id: unitExists ? staff.unit_id : '' });
          }
        }
      };

      const handleEditFromTable = (s) => {
        setSelectedStaffId(s.id);
        const unitExists = units.some(u => u.id === s.unit_id);
        setForm({ nama: s.nama, jabatan: s.jabatan || '', unit_id: unitExists ? s.unit_id : '' });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleSave = async (e) => {
        e.preventDefault();
        if (!form.nama.trim()) return alert('Nama pegawai wajib diisi!');
        if (!form.unit_id) return alert('Silakan pilih penempatan ruangan / unit tugas pegawai terlebih dahulu!');
        setIsProcessing(true);

        if (selectedStaffId === 'NEW') {
          await supabase.from('master_staff').insert([{ unit_id: form.unit_id, nama: form.nama.trim(), jabatan: form.jabatan }]);
        } else if (selectedStaffId) {
          await supabase.from('master_staff').update({ nama: form.nama.trim(), jabatan: form.jabatan, unit_id: form.unit_id }).eq('id', selectedStaffId);
        }
        
        setSelectedStaffId('');
        setForm({ nama: '', jabatan: '', unit_id: session.id });
        await fetchStaff(); await fetchAllStaff();
        setIsProcessing(false);
        alert('Data pegawai berhasil disimpan!');
      };

      const handleDelete = async (id) => {
        if(!window.confirm('Yakin ingin menghapus pegawai ini dari database sistem?')) return;
        await supabase.from('master_staff').delete().eq('id', id);
        fetchStaff(); fetchAllStaff();
      };

      const filteredStaffList = staffList.filter(s => s.nama.toLowerCase().includes(searchQuery.toLowerCase()));
      
      // Logika pencarian cerdas untuk dropdown seluruh pegawai RS
      const filteredAllStaff = allStaff.filter(s => 
        s.nama.toLowerCase().includes(dropdownSearch.toLowerCase()) || 
        (s.jabatan && s.jabatan.toLowerCase().includes(dropdownSearch.toLowerCase()))
      );

      return (
        <div className="bg-white rounded-2xl md:rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
          <div className="p-4 md:p-6 border-b border-slate-200 bg-slate-50">
            <h2 className="text-base md:text-lg font-bold text-slate-800">Manajemen Pegawai Terpusat</h2>
            <p className="text-[11px] md:text-sm text-slate-500">Tarik nama dari ruangan lain, perbarui biodata, atau tambahkan pegawai baru.</p>
          </div>
          <div className="p-4 md:p-6 border-b border-slate-200">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-5">
              <div className="md:col-span-2">
                <label className="block text-xs md:text-sm font-bold text-slate-700 mb-1.5">1. Cari & Pilih Nama Pegawai dari Database RS</label>
                <div className="flex flex-col sm:flex-row gap-2">
                  <div className="relative w-full sm:w-1/3">
                    <input 
                      type="text" 
                      placeholder="🔍 Ketik nama..." 
                      value={dropdownSearch} 
                      onChange={e => setDropdownSearch(e.target.value)} 
                      className="w-full px-3 py-2.5 md:py-3 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-rose-800 text-sm outline-none"
                    />
                    {dropdownSearch && (
                      <button type="button" onClick={() => setDropdownSearch('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
                    )}
                  </div>
                  <select value={selectedStaffId} onChange={handleSelectStaff} className="w-full sm:w-2/3 px-3 py-2.5 md:py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-rose-800 font-medium text-sm outline-none">
                    <option value="">-- Hasil Pencarian ({filteredAllStaff.length}) Pegawai --</option>
                    <option value="NEW" className="font-bold text-rose-700">➕ BUAT NAMA PEGAWAI BARU</option>
                    {filteredAllStaff.map(s => {

    // ==========================================
    // 4. KOMPONEN REKAP & PENCARIAN (UPDATED: FILTER, PRINT, EXCEL)
    // ==========================================
    function RecapView({ session, units }) {
      const today = new Date();
      const currentYear = today.getFullYear().toString();
      const currentMonth = today.getMonth() + 1;
      const currentTriwulan = Math.ceil(currentMonth / 3).toString();

      const [records, setRecords] = useState([]);
      
      // State Filter
      const [filterNama, setFilterNama] = useState('');
      const [filterUnit, setFilterUnit] = useState(session.nama === 'INSTALASI ADMIN SISTEM' ? 'ALL' : session.id);
      const [filterTw, setFilterTw] = useState(currentTriwulan);
      const [filterTahun, setFilterTahun] = useState(currentYear);
      const [isLoading, setIsLoading] = useState(false);

      useEffect(() => {
        fetchRecords();
      }, [filterUnit, filterTw, filterTahun]);

      const fetchRecords = async () => {
        setIsLoading(true);
        let startDate, endDate;
        if (filterTw === '1') { startDate = `${filterTahun}-01-01`; endDate = `${filterTahun}-03-31`; }
        else if (filterTw === '2') { startDate = `${filterTahun}-04-01`; endDate = `${filterTahun}-06-30`; }
        else if (filterTw === '3') { startDate = `${filterTahun}-07-01`; endDate = `${filterTahun}-09-30`; }
        else if (filterTw === '4') { startDate = `${filterTahun}-10-01`; endDate = `${filterTahun}-12-31`; }

        let query = supabase.from('evaluation_records')
          .select('*')
          .gte('tanggal', startDate)
          .lte('tanggal', endDate)
          .order('tanggal', { ascending: false });

        if (filterUnit !== 'ALL') {
          query = query.eq('unit_id', filterUnit);
        }

        const { data } = await query;
        if(data) setRecords(data);
        setIsLoading(false);
      };

      const handleDelete = async (id) => {
        if(!window.confirm('Hapus data evaluasi ini?')) return;
        await supabase.from('evaluation_records').delete().eq('id', id);
        setRecords(records.filter(r => r.id !== id));
      };

      const handleExportExcel = () => {
        try {
          if (typeof window.XLSX === 'undefined') {
            alert('Library Excel belum dimuat dengan benar. Pastikan koneksi internet lancar dan script XLSX ada di <head>.');
            return;
          }

          if (filteredRecords.length === 0) return alert('Tidak ada data untuk diekspor!');
          
          const exportData = filteredRecords.map((r, index) => {
            const avgSkala = ((r.seragam + r.atribut + r.sepatu + r.salam)/4).toFixed(1);
            const totalYa = [r.id_card, r.pin_logo, r.salam_prima, r.seragam_aturan, r.ramah_sopan, r.tanggung_jawab, r.tolak_hadiah, r.sesuai_wewenang, r.hadir_rapat, r.bekerja_penuh_tj].filter(v => v === 'Ya').length;
            
            return {
              'No': index + 1,
              'Tanggal': r.tanggal,
              'Nama Pegawai': r.nama,
              'Ruangan / Unit': r.unit_nama,
              // Kategori Skala
              'Nilai Skala': avgSkala,
              'Skala Seragam': r.seragam,
              'Skala Atribut': r.atribut,
              'Skala Sepatu': r.sepatu,
              'Skala Salam': r.salam,
              // Kategori Etika
              'Total Etika (Ya)': totalYa,
              'ID Card': r.id_card,
              'Pin Logo': r.pin_logo,
              'Salam Prima (Etika)': r.salam_prima,
              'Seragam Sesuai Aturan': r.seragam_aturan,
              'Ramah & Sopan': r.ramah_sopan,
              'Tanggung Jawab & Jujur': r.tanggung_jawab,
              'Tolak Gratifikasi': r.tolak_hadiah,
              'Sesuai Wewenang': r.sesuai_wewenang,
              'Hadir Rapat/Dinas': r.hadir_rapat,
              'Bekerja Penuh TJ': r.bekerja_penuh_tj
            };
          });

          const worksheet = window.XLSX.utils.json_to_sheet(exportData);
          const workbook = window.XLSX.utils.book_new();
          window.XLSX.utils.book_append_sheet(workbook, worksheet, "Rekap Evaluasi");
          window.XLSX.writeFile(workbook, `Rekap_Evaluasi_${filterTahun}_TW${filterTw}_${filterUnit === 'ALL' ? 'Semua' : 'Ruangan'}.xlsx`);
          
        } catch (error) {
          console.error("Error Export:", error);
          alert("Gagal melakukan export: " + error.message);
        }
      };

      const filteredRecords = records.filter(r => r.nama.toLowerCase().includes(filterNama.toLowerCase()));

      return (
        <div className="bg-white rounded-2xl md:rounded-3xl shadow-sm border border-slate-200 overflow-hidden print-w-full">
          <div className="p-4 md:p-6 border-b border-slate-200 bg-slate-50 no-print">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-5">
              <h2 className="text-base md:text-lg font-bold text-slate-800">Rekap & Laporan Evaluasi</h2>
              <div className="flex gap-2 w-full md:w-auto">
                <button onClick={() => window.print()} className="flex-1 md:flex-none px-4 py-2 bg-slate-900 text-amber-400 font-bold rounded-xl text-xs md:text-sm hover:bg-black transition-colors">🖨️ Cetak</button>
                <button onClick={handleExportExcel} className="flex-1 md:flex-none px-4 py-2 bg-emerald-600 text-white font-bold rounded-xl text-xs md:text-sm hover:bg-emerald-700 transition-colors">📊 Export XLSX</button>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
              <div>
                <label className="block text-[10px] md:text-xs font-bold text-slate-700 mb-1">Tahun</label>
                <select value={filterTahun} onChange={e => setFilterTahun(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-rose-800 outline-none">
                  <option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option>
                </select>
              </div>
              <div>
                <label className="block text-[10px] md:text-xs font-bold text-slate-700 mb-1">Triwulan (TW)</label>
                <select value={filterTw} onChange={e => setFilterTw(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-rose-800 outline-none">
                  <option value="1">TW I</option><option value="2">TW II</option><option value="3">TW III</option><option value="4">TW IV</option>
                </select>
              </div>
              <div>
                <label className="block text-[10px] md:text-xs font-bold text-slate-700 mb-1">Ruangan/Unit</label>
                <select value={filterUnit} onChange={e => setFilterUnit(e.target.value)} disabled={session.nama !== 'INSTALASI ADMIN SISTEM'} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-rose-800 outline-none disabled:bg-slate-200">
                  {session.nama === 'INSTALASI ADMIN SISTEM' && <option value="ALL">Semua Ruangan</option>}
                  {session.nama !== 'INSTALASI ADMIN SISTEM' && <option value={session.id}>{session.nama}</option>}
                  {session.nama === 'INSTALASI ADMIN SISTEM' && units.map(u => <option key={u.id} value={u.id}>{u.nama}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-[10px] md:text-xs font-bold text-slate-700 mb-1">Cari Nama Pegawai</label>
                <input type="text" placeholder="Ketik nama..." value={filterNama} onChange={e => setFilterNama(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-rose-800 text-sm outline-none" />
              </div>
            </div>
          </div>

          {/* Kop Cetak - Hanya muncul saat diprint */}
          <div className="hidden print:block text-center pt-8 pb-4">
             <h2 className="text-xl font-bold uppercase text-black">Laporan Evaluasi Kepatuhan Pegawai</h2>
             <p className="text-sm text-black mt-1">Periode: Triwulan {filterTw} / Tahun {filterTahun}</p>
             <p className="text-sm font-bold text-black">Ruangan: {filterUnit === 'ALL' ? 'Seluruh Ruangan' : units.find(u => u.id === filterUnit)?.nama || session.nama}</p>
             <hr className="mt-4 border-2 border-black" />
          </div>

          <div className="overflow-x-auto print:p-4">
            {isLoading ? (
              <div className="p-8 text-center text-slate-500 font-bold">Memuat Data...</div>
            ) : (
            <table className="w-full text-left text-xs md:text-sm border-collapse min-w-[600px] print:w-full">
              <thead className="bg-slate-900 text-amber-400 print:bg-slate-200 print:text-black">
                <tr>
                  <th className="p-3 md:p-4 font-semibold border-b border-slate-700 print:border-black">Tanggal</th>
                  <th className="p-3 md:p-4 font-semibold border-b border-slate-700 print:border-black">Nama Pegawai</th>
                  <th className="p-3 md:p-4 font-semibold border-b border-slate-700 print:border-black">Ruangan</th>
                  <th className="p-3 md:p-4 font-semibold text-center border-b border-slate-700 print:border-black">Skala (1-5)</th>
                  <th className="p-3 md:p-4 font-semibold text-center border-b border-slate-700 print:border-black">Etika (Ya)</th>
                  <th className="p-3 md:p-4 font-semibold text-center border-b border-slate-700 no-print">Aksi</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 bg-white">
                {filteredRecords.length === 0 ? (
                  <tr><td colSpan="6" className="p-8 text-center text-slate-500">Tidak ada data evaluasi ditemukan.</td></tr>
                ) : (
                  filteredRecords.map(r => {
                    const avgSkala = ((r.seragam + r.atribut + r.sepatu + r.salam)/4).toFixed(1);
                    const totalYa = [r.id_card, r.pin_logo, r.salam_prima, r.seragam_aturan, r.ramah_sopan, r.tanggung_jawab, r.tolak_hadiah, r.sesuai_wewenang, r.hadir_rapat, r.bekerja_penuh_tj].filter(v => v === 'Ya').length;
                    return (
                      <tr key={r.id} className="hover:bg-rose-50 transition-colors">
                        <td className="p-3 md:p-4 text-[10px] md:text-xs text-slate-500 print:text-black">{new Date(r.tanggal).toLocaleDateString('id-ID')}</td>
                        <td className="p-3 md:p-4 font-bold text-slate-800 print:text-black">{r.nama}</td>
                        <td className="p-3 md:p-4 text-slate-600 print:text-black">{r.unit_nama}</td>
                        <td className="p-3 md:p-4 text-center">
                           <span className={`px-2 py-1 rounded-full font-bold text-[10px] md:text-xs ${avgSkala >= 4 ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>{avgSkala} / 5.0</span>
                        </td>
                        <td className="p-3 md:p-4 text-center">
                           <span className={`px-2 py-1 rounded-full font-bold text-[10px] md:text-xs ${totalYa >= 8 ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>{totalYa} (Ya)</span>
                        </td>
                        <td className="p-3 md:p-4 text-center no-print"><button onClick={() => handleDelete(r.id)} className="px-2 py-1 bg-rose-100 text-rose-700 rounded-md text-[10px] md:text-xs font-bold">Hapus</button></td>
                      </tr>
                    );
                  })
                )}
              </tbody>
            </table>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. KOMPONEN FORM INPUT EVALUASI
    // ==========================================
    function EvaluasiForm({ session }) {
      const [staffList, setStaffList] = useState([]);
      const [nama, setNama] = useState('');
      const [tanggal, setTanggal] = useState(new Date().toISOString().split('T')[0]);
      const [isSubmitting, setIsSubmitting] = useState(false);
      
      const [skala, setSkala] = useState({ seragam: 5, atribut: 5, sepatu: 5, salam: 5 });
      const [etika, setEtika] = useState({ id_card: 'Ya', pin_logo: 'Ya', salam_prima: 'Ya', seragam_aturan: 'Ya', ramah_sopan: 'Ya', tanggung_jawab: 'Ya', tolak_hadiah: 'Ya', sesuai_wewenang: 'Ya', hadir_rapat: 'Ya', bekerja_penuh_tj: 'Ya' });

      useEffect(() => {
        supabase.from('master_staff').select('*').eq('unit_id', session.id).order('nama').then(({data}) => { if (data) setStaffList(data); });
      }, [session.id]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!nama) return alert('Pilih nama pegawai!');
        setIsSubmitting(true);
        const { error } = await supabase.from('evaluation_records').insert([{ unit_id: session.id, unit_nama: session.nama, nama, tanggal, ...skala, ...etika }]);
        if (error) alert('Gagal: ' + error.message);
        else {
          alert('Berhasil menyimpan penilaian untuk ' + nama);
          setNama(''); setSkala({ seragam: 5, atribut: 5, sepatu: 5, salam: 5 });
          setEtika({ id_card: 'Ya', pin_logo: 'Ya', salam_prima: 'Ya', seragam_aturan: 'Ya', ramah_sopan: 'Ya', tanggung_jawab: 'Ya', tolak_hadiah: 'Ya', sesuai_wewenang: 'Ya', hadir_rapat: 'Ya', bekerja_penuh_tj: 'Ya' });
        }
        setIsSubmitting(false);
      };

      const skalaQ = [{ k: 'seragam', l: '1. Seragam sesuai ketentuan' }, { k: 'atribut', l: '2. Atribut (ID Card, Pin)' }, { k: 'sepatu', l: '3. Sepatu saat pelayanan' }, { k: 'salam', l: '4. Menerapkan salam prima' }];
      const etikaQ = [{ k: 'id_card', l: '1. Menggunakan ID card' }, { k: 'pin_logo', l: '2. Menggunakan pin logo' }, { k: 'salam_prima', l: '3. Menerapkan salam prima' }, { k: 'seragam_aturan', l: '4. Seragam sesuai aturan' }, { k: 'ramah_sopan', l: '5. Ramah & sopan' }, { k: 'tanggung_jawab', l: '6. Tanggung jawab & jujur' }, { k: 'tolak_hadiah', l: '7. Menolak imbalan/gratifikasi' }, { k: 'sesuai_wewenang', l: '8. Sesuai wewenang tugas' }, { k: 'hadir_rapat', l: '9. Hadir panggilan dinas' }, { k: 'bekerja_penuh_tj', l: '10. Bekerja penuh tanggungjawab' }];

      return (
        <form onSubmit={handleSubmit} className="bg-white rounded-2xl md:rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
          <div className="p-4 md:p-6 bg-slate-50 border-b border-slate-200 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label className="block text-xs md:text-sm font-bold text-slate-700 mb-1.5">Tanggal Evaluasi</label>
              <input type="date" value={tanggal} onChange={e => setTanggal(e.target.value)} className="w-full px-3 py-2.5 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-rose-800 text-sm" required />
            </div>
            <div>
              <label className="block text-xs md:text-sm font-bold text-slate-700 mb-1.5">Pilih Pegawai dari {session.nama}</label>
              <select value={nama} onChange={e => setNama(e.target.value)} className="w-full px-3 py-2.5 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-rose-800 text-sm" required>
                <option value="" disabled>-- Pilih Pegawai --</option>
                {staffList.map(s => <option key={s.id} value={s.nama}>{s.nama}</option>)}
              </select>
            </div>
          </div>
          
          <div className="p-4 md:p-6 border-b border-slate-200">
            <h3 className="font-bold mb-3 md:mb-4 uppercase text-xs md:text-sm tracking-wider text-rose-900">A. Skala Kepatuhan (1 - 5)</h3>
            <div className="space-y-3">
              {skalaQ.map(q => (
                <div key={q.k} className="flex flex-col sm:flex-row justify-between sm:items-center p-3 bg-white rounded-xl border border-slate-200 shadow-sm gap-2">
                  <span className="text-xs md:text-sm font-medium text-slate-800">{q.l}</span>
                  <div className="flex gap-1.5 justify-between sm:justify-end w-full sm:w-auto">
                    {[1,2,3,4,5].map(v => (
                      <button key={v} type="button" onClick={() => setSkala({...skala, [q.k]: v})} className={`flex-1 sm:flex-none w-8 h-8 md:w-10 md:h-10 rounded-lg font-bold transition-all text-xs md:text-sm ${skala[q.k] === v ? 'bg-gradient-to-br from-rose-800 to-slate-900 text-amber-400 shadow-md border-rose-900' : 'bg-slate-50 border border-slate-300 text-slate-600 hover:bg-slate-200'}`}>{v}</button>
                    ))}
                  </div>
                </div>
              ))}

          </div>

          <div className="p-4 md:p-6">

          </div>

          <div className="p-4 md:p-6 bg-slate-50 border-t border-slate-200 flex justify-end">
            <button type="submit" disabled={isSubmitting} className="w-full sm:w-auto px-8 py-3 bg-gradient-to-r from-rose-800 to-black hover:from-rose-900 text-amber-400 font-bold rounded-xl disabled:opacity-50 transition-all shadow-md text-sm">
              {isSubmitting ? 'Menyimpan...' : 'Simpan Penilaian'}
            </button>
          </div>
        </form>
      );
    }

    // ==========================================
    // 6. KOMPONEN C-PANEL SUPERADMIN
    // ==========================================
    function CPanel({ systemPin, onUpdatePin }) {
      const [units, setUnits] = useState([]);
      const [newUnit, setNewUnit] = useState({ nama: '', kategori: 'Ruangan' });
      const [isProcessing, setIsProcessing] = useState(false);
      const [showPinModal, setShowPinModal] = useState(false);
      const [pinForm, setPinForm] = useState({ oldPin: '', newPin: '' });
      
      const [runningText, setRunningText] = useState('');
      
      // Tambahan State untuk Modal Edit Ruangan
      const [editUnitModal, setEditUnitModal] = useState({ isOpen: false, id: '', nama: '', kategori: 'Ruangan' });

      useEffect(() => { 
        fetchUnits(); 
        supabase.from('app_settings').select('value').eq('id', 'running_text').single().then(({data}) => { if (data) setRunningText(data.value); });
      }, []);

      const fetchUnits = async () => {
        const { data } = await supabase.from('master_units').select('*').order('nama');
        if (data) setUnits(data);
      };

      const handleAddUnit = async (e) => {
        e.preventDefault();
        if (!newUnit.nama.trim()) return;
        setIsProcessing(true);
        const id = newUnit.nama.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
        const { error } = await supabase.from('master_units').insert([{ id, nama: newUnit.nama.toUpperCase(), kategori: newUnit.kategori }]);
        if (error) alert('Gagal: ' + error.message);
        else { alert('Ruangan berhasil ditambahkan!'); setNewUnit({ nama: '', kategori: 'Ruangan' }); fetchUnits(); }
        setIsProcessing(false);
      };

      const handleDeleteUnit = async (id) => {
        if (!window.confirm('PERINGATAN! Menghapus ruangan akan MENGHAPUS SEMUA PEGAWAI di dalamnya. Lanjutkan?')) return;
        await supabase.from('master_units').delete().eq('id', id);
        fetchUnits();
      };

      // Tambahan Fungsi Update
      const handleUpdateUnit = async (e) => {
        e.preventDefault();
        if (!editUnitModal.nama.trim()) return;
        setIsProcessing(true);
        const { error } = await supabase.from('master_units')
          .update({ nama: editUnitModal.nama.toUpperCase(), kategori: editUnitModal.kategori })
          .eq('id', editUnitModal.id);
        
        if (error) alert('Gagal mengupdate ruangan: ' + error.message);
        else {
          alert('Data Ruangan berhasil diperbarui!');
          setEditUnitModal({ isOpen: false, id: '', nama: '', kategori: 'Ruangan' });
          fetchUnits();
        }
        setIsProcessing(false);
      };

      const handleUpdatePin = async (e) => {
        e.preventDefault();
        if (pinForm.oldPin !== systemPin) return alert('PIN Lama salah!');
        if (pinForm.newPin.length < 6) return alert('PIN Baru minimal 6 digit!');
        await supabase.from('app_settings').update({ value: pinForm.newPin }).eq('id', 'cpanel_pin');
        alert('PIN C-Panel diubah!');
        onUpdatePin(pinForm.newPin); setShowPinModal(false); setPinForm({ oldPin: '', newPin: '' });
      };

      const handleSaveRunningText = async (e) => {
        e.preventDefault();
        setIsProcessing(true);
        await supabase.from('app_settings').update({ value: runningText }).eq('id', 'running_text');
        window.dispatchEvent(new CustomEvent('runningTextChanged', { detail: runningText }));
        alert('Teks Berjalan berhasil diperbarui!');
        setIsProcessing(false);
      };

      return (
        <div className="space-y-6">
          {/* Modal Edit Ruangan */}
          {editUnitModal.isOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-xl border-t-8 border-slate-900">
                <h3 className="text-lg font-bold text-slate-800 mb-4">Edit Ruangan / Unit</h3>
                <form onSubmit={handleUpdateUnit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">ID Sistem (Tidak dapat diubah)</label>
                    <input type="text" value={editUnitModal.id} disabled className="w-full px-3 py-2 border border-slate-200 rounded-lg bg-slate-100 text-slate-500 font-mono text-xs cursor-not-allowed" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Nama Ruangan</label>
                    <input type="text" value={editUnitModal.nama} onChange={e=>setEditUnitModal({...editUnitModal, nama: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-900 uppercase" required />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Kategori</label>
                    <select value={editUnitModal.kategori} onChange={e=>setEditUnitModal({...editUnitModal, kategori: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-900 bg-white">
                      <option>Ruangan</option><option>Instalasi</option><option>Unit</option>
                    </select>
                  </div>
                  <div className="flex gap-2 justify-end mt-4">
                    <button type="button" onClick={() => setEditUnitModal({ isOpen: false, id: '', nama: '', kategori: 'Ruangan' })} className="px-4 py-2 bg-slate-200 text-slate-700 font-bold rounded-lg text-sm">Batal</button>
                    <button type="submit" disabled={isProcessing} className="px-4 py-2 bg-slate-900 text-amber-400 font-bold rounded-lg text-sm disabled:opacity-50">Update</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {showPinModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-xl border-t-8 border-slate-900">
                <h3 className="text-lg font-bold text-slate-800 mb-4">Ubah PIN C-Panel</h3>
                <form onSubmit={handleUpdatePin} className="space-y-4">
                  <input type="password" placeholder="PIN Lama" value={pinForm.oldPin} onChange={e=>setPinForm({...pinForm, oldPin: e.target.value})} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-slate-900" required />
                  <input type="password" placeholder="PIN Baru (Min 6 digit)" value={pinForm.newPin} onChange={e=>setPinForm({...pinForm, newPin: e.target.value})} minLength={6} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-slate-900" required />
                  <div className="flex gap-2 justify-end mt-4">
                    <button type="button" onClick={() => setShowPinModal(false)} className="px-4 py-2 bg-slate-200 rounded-lg text-sm font-bold">Batal</button>
                    <button type="submit" className="px-4 py-2 bg-slate-900 text-amber-400 font-bold rounded-lg text-sm">Simpan</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <div className="bg-slate-900 border-l-4 border-amber-500 rounded-2xl p-4 md:p-6 text-white flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-md">
            <div>
              <h2 className="text-xl md:text-2xl font-bold text-amber-400">Control Panel (Admin)</h2>
              <p className="text-slate-400 text-xs md:text-sm mt-1">Pusat kendali master data sistem.</p>
            </div>
            <button onClick={() => setShowPinModal(true)} className="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-xl font-bold text-xs md:text-sm border border-slate-700 w-full md:w-auto">Ubah PIN C-Panel</button>
          </div>

          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-6">
            <h3 className="font-bold text-base md:text-lg text-slate-800 mb-4">Pengaturan Tampilan</h3>
            <form onSubmit={handleSaveRunningText} className="flex flex-col md:flex-row gap-3">
               <input type="text" value={runningText} onChange={e=>setRunningText(e.target.value)} className="flex-1 px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-900 text-sm" placeholder="Ketik teks berjalan..." required />
               <button type="submit" disabled={isProcessing} className="px-6 py-2.5 bg-slate-900 hover:bg-black text-amber-400 font-bold rounded-xl disabled:opacity-50 text-sm">Simpan Teks</button>
            </form>
          </div>

          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-6">
            <h3 className="font-bold text-base md:text-lg text-slate-800 mb-4">Master Data Ruangan</h3>
            <form onSubmit={handleAddUnit} className="flex flex-col md:flex-row gap-3 mb-6 p-4 bg-slate-50 border border-slate-200 rounded-xl">
              <input type="text" placeholder="Nama Ruangan/Unit Baru" value={newUnit.nama} onChange={e=>setNewUnit({...newUnit, nama: e.target.value})} className="flex-1 px-4 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-slate-900" required />
              <select value={newUnit.kategori} onChange={e=>setNewUnit({...newUnit, kategori: e.target.value})} className="px-4 py-2 border rounded-xl bg-white text-sm focus:ring-2 focus:ring-slate-900"><option>Ruangan</option><option>Instalasi</option><option>Unit</option></select>
              <button type="submit" disabled={isProcessing} className="px-6 py-2 bg-slate-900 text-amber-400 font-bold rounded-xl text-sm">+ Tambah</button>
            </form>
            <div className="overflow-x-auto border border-slate-200 rounded-xl">
              <table className="w-full text-left text-xs md:text-sm">
                <thead className="bg-slate-100 text-slate-700"><tr className="border-b border-slate-200">
                  <th className="p-3 md:p-4">Kategori</th><th className="p-3 md:p-4">Nama Ruangan</th><th className="p-3 md:p-4 text-center">Aksi</th>
                </tr></thead>
                <tbody className="divide-y divide-slate-100">
                  {units.map(u => (
                    <tr key={u.id} className="hover:bg-slate-50">
                      <td className="p-3 md:p-4"><span className="bg-slate-200 text-slate-700 px-2 py-1 rounded font-bold text-[10px] md:text-xs">{u.kategori}</span></td>
                      <td className="p-3 md:p-4 font-bold text-slate-800">{u.nama}</td>
                      <td className="p-3 md:p-4 text-center flex items-center justify-center gap-2">
                        <button onClick={() => setEditUnitModal({ isOpen: true, id: u.id, nama: u.nama, kategori: u.kategori })} className="px-3 py-1 bg-amber-100 text-amber-700 font-bold rounded-lg text-xs hover:bg-amber-200 transition-colors">Edit</button>
                        <button onClick={() => handleDeleteUnit(u.id)} className="px-3 py-1 bg-rose-100 text-rose-700 font-bold rounded-lg text-xs hover:bg-rose-200 transition-colors">Hapus</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 7. MAIN APP CONTROLLER
    // ==========================================
    function App() {
      const [session, setSession] = useState(null); 
      const [masterUnits, setMasterUnits] = useState([]);
      const [activeTab, setActiveTab] = useState('input');
      
      const [isAdminVerified, setIsAdminVerified] = useState(false);
      const [adminPin, setAdminPin] = useState('');
      const [systemPin, setSystemPin] = useState('987654321');

      const [showPassModal, setShowPassModal] = useState(false);
      const [passForm, setPassForm] = useState({ oldPin: '', newPin: '' });

      useEffect(() => {
        if (session) {
           supabase.from('master_units').select('*').order('nama').then(({data}) => { if (data) setMasterUnits(data); });
           supabase.from('app_settings').select('*').eq('id', 'cpanel_pin').single().then(({data}) => { if (data) setSystemPin(data.value); });
        }
      }, [session]);

      const handleUpdatePassword = async (e) => {
        e.preventDefault();
        if (passForm.oldPin !== session.password) return alert('Gagal! Password Lama salah.');
        if (passForm.newPin.length < 6) return alert('Password Baru min 6 karakter.');
        const { error } = await supabase.from('master_units').update({ password: passForm.newPin }).eq('id', session.id);
        if (error) alert('Gagal: ' + error.message);
        else {
          alert('Password ruangan berhasil diubah!');
          setSession({ ...session, password: passForm.newPin }); 
          setShowPassModal(false); setPassForm({ oldPin: '', newPin: '' });
        }
      };

      if (!session) return <LandingPage onLogin={setSession} />;

      return (
        <div className="flex flex-col flex-1 bg-slate-100">
          <RunningTextBar />
          
          <div className="w-full max-w-7xl mx-auto p-2 sm:p-4 md:p-8 space-y-4 md:space-y-6 flex-1">
            
            {showPassModal && (
              <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl w-full max-w-sm p-6 md:p-8 shadow-2xl border-t-8 border-rose-800">
                  <h3 className="text-xl font-bold text-slate-800 mb-6">Ubah Password Ruangan</h3>
                  <form onSubmit={handleUpdatePassword} className="space-y-4">
                    <input type="password" placeholder="Password Lama" value={passForm.oldPin} onChange={e=>setPassForm({...passForm, oldPin: e.target.value})} className="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-rose-800 focus:outline-none" required />
                    <input type="password" placeholder="Password Baru (Min 6 char)" value={passForm.newPin} onChange={e=>setPassForm({...passForm, newPin: e.target.value})} minLength={6} className="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-rose-800 focus:outline-none" required />
                    <div className="flex gap-3 justify-end mt-6">
                      <button type="button" onClick={() => setShowPassModal(false)} className="px-5 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200">Batal</button>
                      <button type="submit" className="px-5 py-2.5 bg-rose-800 text-white font-bold rounded-xl hover:bg-rose-900">Simpan</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Header Dashboard Internal */}
            <div className="bg-white p-4 md:p-6 rounded-2xl md:rounded-3xl shadow-sm border-b-4 border-amber-500 flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3 md:gap-4">
                <img src="./logo_atma.png" alt="Logo" className="w-12 h-12 md:w-14 md:h-14 object-contain bg-slate-100 rounded-full p-1 border border-slate-200" />
                <div className="text-center md:text-left">
                  <h1 className="text-lg md:text-xl font-extrabold text-slate-900 uppercase">Dashboard Evaluator</h1>
                  <p className="text-rose-700 font-bold text-xs md:text-sm mt-0.5">📍 {session.nama}</p>
                </div>
              </div>
              <div className="flex w-full md:w-auto gap-2">
                <button onClick={() => setShowPassModal(true)} className="flex-1 md:flex-none px-4 py-2.5 bg-slate-900 hover:bg-black text-amber-400 font-bold rounded-xl transition-colors text-xs md:text-sm border border-slate-700">🔑 Ubah Password</button>
                <button onClick={() => setSession(null)} className="flex-1 md:flex-none px-4 py-2.5 bg-rose-100 hover:bg-rose-200 text-rose-800 font-bold rounded-xl transition-colors text-xs md:text-sm">🚪 Keluar</button>
              </div>
            </div>

            {/* Navigation Tabs Scrollable for Mobile */}
            <div className="flex gap-2 overflow-x-auto pb-2 hide-scrollbar">
              <button onClick={() => setActiveTab('input')} className={`px-4 md:px-5 py-2.5 rounded-xl font-bold text-xs md:text-sm whitespace-nowrap transition-all ${activeTab === 'input' ? 'bg-gradient-to-r from-rose-800 to-slate-900 text-amber-400 shadow-md border-b-2 border-amber-400' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`}>📝 Input Evaluasi</button>
              <button onClick={() => setActiveTab('recap')} className={`px-4 md:px-5 py-2.5 rounded-xl font-bold text-xs md:text-sm whitespace-nowrap transition-all ${activeTab === 'recap' ? 'bg-gradient-to-r from-rose-800 to-slate-900 text-amber-400 shadow-md border-b-2 border-amber-400' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`}>📊 Rekap Data</button>
              <button onClick={() => setActiveTab('staff')} className={`px-4 md:px-5 py-2.5 rounded-xl font-bold text-xs md:text-sm whitespace-nowrap transition-all ${activeTab === 'staff' ? 'bg-gradient-to-r from-rose-800 to-slate-900 text-amber-400 shadow-md border-b-2 border-amber-400' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`}>👥 Data Pegawai</button>
              <button onClick={() => setActiveTab('stats')} className={`px-4 md:px-5 py-2.5 rounded-xl font-bold text-xs md:text-sm whitespace-nowrap transition-all ${activeTab === 'stats' ? 'bg-gradient-to-r from-rose-800 to-slate-900 text-amber-400 shadow-md border-b-2 border-amber-400' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`}>📈 Statistik</button>
              
              {session.nama === 'INSTALASI ADMIN SISTEM' && (
                <button onClick={() => setActiveTab('cpanel')} className={`px-4 md:px-5 py-2.5 rounded-xl font-bold text-xs md:text-sm whitespace-nowrap transition-all ${activeTab === 'cpanel' ? 'bg-slate-900 text-amber-400 shadow-md border-b-2 border-amber-400' : 'bg-white text-slate-600 border border-slate-200'}`}>⚙️ C-Panel (Admin)</button>
              )}
            </div>

            <div className="pb-10">
              {activeTab === 'input' && <EvaluasiForm session={session} />}
              {activeTab === 'recap' && <RecapView session={session} units={masterUnits} />}
              {activeTab === 'staff' && <StaffManager session={session} units={masterUnits} />}
              {activeTab === 'stats' && <DashboardStats units={masterUnits} />}
              
              {activeTab === 'cpanel' && session.nama === 'INSTALASI ADMIN SISTEM' && (
                !isAdminVerified ? (
                  <div className="bg-white rounded-3xl shadow-xl border-t-8 border-slate-900 p-8 max-w-sm mx-auto mt-10">
                    <h2 className="text-xl font-extrabold text-center mb-2 text-slate-900">Akses C-Panel</h2>
                    <p className="text-xs text-center text-slate-500 mb-6">Masukkan PIN Superadmin</p>
                    <form onSubmit={(e) => { e.preventDefault(); if (adminPin === systemPin) { setIsAdminVerified(true); setAdminPin(''); } else { alert('PIN Salah!'); setAdminPin(''); } }}>
                      <input type="password" value={adminPin} onChange={e => setAdminPin(e.target.value)} placeholder="• • • • • •" className="w-full px-4 py-4 bg-slate-50 border border-slate-300 rounded-xl text-center font-bold tracking-[0.5em] text-xl mb-4 focus:ring-2 focus:ring-slate-900 outline-none" required />
                      <button type="submit" className="w-full py-3.5 bg-slate-900 hover:bg-black text-amber-400 font-bold rounded-xl transition-all shadow-md">Buka Kunci</button>
                    </form>
                  </div>
                ) : ( <CPanel systemPin={systemPin} onUpdatePin={setSystemPin} /> )
              )}
            </div>
          </div>
          
          <footer className="bg-slate-900 text-slate-400 py-6 md:py-8 mt-auto border-t-4 border-rose-900">
            <div className="max-w-7xl mx-auto px-4 text-center">
              <p className="text-xs md:text-sm font-medium tracking-wide text-slate-300">
                Didesain dan dikembangkan oleh : <strong className="text-amber-400">Riandy, S.Kep</strong>
              </p>
              <p className="text-[10px] md:text-xs mt-1.5 text-slate-500">© 2024 RSJD Atma Husada Mahakam. Hak Cipta Dilindungi.</p>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
